services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-along}
      POSTGRES_USER: ${POSTGRES_USER:-along}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-along}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-along} -d ${POSTGRES_DB:-along}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-along}
      POSTGRES_USER: ${POSTGRES_USER:-along}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-along}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
      DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-false}
      DJANGO_SECURE_PROXY_SSL_HEADER: ${DJANGO_SECURE_PROXY_SSL_HEADER:-false}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      ALONG_BRAND_NAME: ${ALONG_BRAND_NAME:-Along}
      ALONG_TAGLINE: ${ALONG_TAGLINE:-Good company. Great experiences.}
      ALONG_COUNTRY_CODE: ${ALONG_COUNTRY_CODE:-BD}
      ALONG_CURRENCY_CODE: ${ALONG_CURRENCY_CODE:-BDT}
      ALONG_TIME_ZONE: ${ALONG_TIME_ZONE:-Asia/Dhaka}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  celery:
    build:
      context: ./backend
    command: celery -A config worker -l info
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-along}
      POSTGRES_USER: ${POSTGRES_USER:-along}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-along}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key}
      DJANGO_DEBUG: "True"
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      ALONG_BRAND_NAME: ${ALONG_BRAND_NAME:-Along}
      ALONG_TAGLINE: ${ALONG_TAGLINE:-Good company. Great experiences.}
      ALONG_COUNTRY_CODE: ${ALONG_COUNTRY_CODE:-BD}
      ALONG_CURRENCY_CODE: ${ALONG_CURRENCY_CODE:-BDT}
      ALONG_TIME_ZONE: ${ALONG_TIME_ZONE:-Asia/Dhaka}
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    depends_on:
      backend:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NEXT_PUBLIC_BRAND_NAME: ${ALONG_BRAND_NAME:-Along}
      NEXT_PUBLIC_TAGLINE: ${ALONG_TAGLINE:-Good company. Great experiences.}
      NEXT_PUBLIC_COUNTRY_CODE: ${ALONG_COUNTRY_CODE:-BD}
      NEXT_PUBLIC_CURRENCY_CODE: ${ALONG_CURRENCY_CODE:-BDT}
      NEXT_PUBLIC_TIME_ZONE: ${ALONG_TIME_ZONE:-Asia/Dhaka}
      NEXT_PUBLIC_LAUNCH_CITY: ${ALONG_LAUNCH_CITY:-Dhaka}
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
